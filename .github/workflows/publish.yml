name: publish

# npm is a snapshot registry: a published tarball never follows the repository, so
# "the npm package follows GitHub" has to be built. This workflow is that builder:
#
#   push to main touching plugin behaviour  ->  tests  ->  version bump (patch)
#                                           ->  publish to npm  ->  tag + release
#
# Behaviour, not documentation, drives it: the path filter below means README or
# workflow edits never burn a version. Bump bigger by putting a marker in the commit
# message ([minor] / [major]), or run the workflow by hand with the bump input.
#
# Authentication is npm Trusted Publishing (OIDC) — no long-lived token to store or
# rotate. One-time setup, after the package exists (see "Releasing" in README.md):
#   npmjs.com -> package dsh-compaction-policy -> Settings -> Trusted Publisher
#   -> GitHub Actions: user zyd232, repository dsh-compaction-policy,
#      workflow publish.yml, environment (empty)
#
# Two things keep the id-token exchange working, and both are easy to break while
# "tidying up" this file:
#   * npm >= 11.5.1. Node 22 ships npm 10.x, which has no OIDC path at all — a
#     token-less publish there dies with ENEEDAUTH, so the step below pins 11.x.
#   * no registry-url on setup-node. It writes `_authToken=${NODE_AUTH_TOKEN}` into
#     .npmrc; with no token that is an empty credential, npm believes it is already
#     authenticated and skips the exchange, and the registry answers 404.
#
# The NPM_TOKEN repository secret is a fallback only, used when a run cannot mint
# an id-token; the publish step decides between the two paths at run time.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'cordis.patch.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this run
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the version commit, the tag, and the release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The version commit below carries this marker, so the follow-up run stops here.
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # v5 turns its package-manager cache on by default and fails on a repository
      # whose package manager it cannot resolve; this plugin has no build step and a
      # three-package install, so the cache buys nothing. No registry-url — see the
      # header: it would write an empty authToken into .npmrc and defeat OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # The npm bundled with Node 22 cannot exchange the GitHub id-token, so a
      # token-less publish would fail with ENEEDAUTH. Pin the 11.x line rather than
      # `latest`: npm 12 also supports trusted publishing but turns install scripts
      # into opt-in, which nothing here needs.
      - name: Use an npm that supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1'
          installed="$(npm --version)"
          echo "npm $installed (trusted publishing needs >= 11.5.1)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && minor >= 5) ? 0 : 1);
          ' "$installed"

      # The tests import one harness package (an optional peer, so consumers do not
      # install it); CI installs it to exercise the real host half.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Decide the version to publish
        id: next
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          local_version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name" version 2>/dev/null || true)"

          if [ -z "$published" ]; then
            echo "not published yet — publishing the repository version $local_version"
            echo "version=$local_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$local_version" != "$published" ]; then
            echo "repository is already ahead of npm ($local_version vs $published) — publishing $local_version"
            echo "version=$local_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${MANUAL_BUMP:-patch}"
          case "$COMMIT_MESSAGE" in
            *"[major]"*) bump=major ;;
            *"[minor]"*) bump=minor ;;
          esac
          next="$(BUMP="$bump" node -e '
            const p = require("./package.json");
            const [major, minor, patch] = p.version.split("-")[0].split(".").map(Number);
            const bump = process.env.BUMP;
            process.stdout.write(
              bump === "major" ? `${major + 1}.0.0`
              : bump === "minor" ? `${major}.${minor + 1}.0`
              : `${major}.${minor}.${patch + 1}`,
            );
          ')"
          npm pkg set "version=$next"
          echo "npm has $published; publishing $next ($bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC) is the default path: GitHub signs this run's
      # id-token and npm exchanges it for a credential scoped to this repository,
      # workflow, and environment — nothing stored is involved in a normal release.
      # The NPM_TOKEN secret is only a fallback for a runner that cannot mint an
      # id-token: the token is written into .npmrc in that branch alone. Note the
      # asymmetry — OIDC needs an .npmrc *without* a token line, a fallback needs one
      # *with* it, so the two cannot both be pre-configured by setup-node.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "publishing with npm trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
          elif [ -n "${NPM_TOKEN:-}" ]; then
            echo "::warning::no id-token on this run — falling back to the NPM_TOKEN secret"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "::error::neither an id-token nor the NPM_TOKEN secret is available"
            exit 1
          fi
          npm publish --access public

      - name: Commit the version, tag it, and open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.next.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already at $version — nothing to commit"
          else
            git commit -m "chore(release): v$version [skip publish]"
            git push origin HEAD:main
          fi
          git tag -f "v$version"
          git push origin "v$version" --force
          gh release create "v$version" --title "v$version" --generate-notes \
            || gh release edit "v$version" --generate-notes
